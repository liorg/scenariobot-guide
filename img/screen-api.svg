<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="The API console">
  <title>The API console</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="820" height="320" rx="10"/>
  <text id="api-title" x="28" y="36" font-size="15" class="t b" text-anchor="start">API Explorer</text>
  <rect id="api-token" x="150" y="22" width="120" height="18" rx="9" class="" style="fill:#EBFBEE"/>
  <text id="api-token-text" x="210.0" y="35" font-size="10" class="t b" text-anchor="middle" style="fill:#2F9E44">token active</text>
  <rect id="api-copy-token" x="286" y="20" width="108" height="26" rx="8" class="panel"/>
  <text id="api-copy-token-label" x="340.0" y="37.0" font-size="11" class="t b" text-anchor="middle">Copy token</text>
  <rect id="api-filter" x="620" y="20" width="176" height="28" rx="8" class="sub"/>
  <text id="api-filter-ph" x="636" y="39" font-size="11" class="t-mut" text-anchor="start">Filter endpoints…</text>
  <rect id="api-sidebar" x="24" y="60" width="230" height="236" rx="10" class="panel"/>
  <text id="api-sidebar-title" x="44" y="84" font-size="9" class="t-mut b" text-anchor="start">TAGS</text>
  <rect id="api-tag-0" x="38" y="96" width="202" height="28" rx="7" class="" style="fill:#EEF2FF;stroke:#3B5BDB"/>
  <text id="api-tag-0-label" x="52" y="115" font-size="11" class="t b" text-anchor="start" style="fill:#3B5BDB">phones</text>
  <text id="api-tag-0-count" x="226" y="115" font-size="10" class="t-mut" text-anchor="end">9</text>
  <rect id="api-tag-1" x="38" y="132" width="202" height="28" rx="7" class="sub"/>
  <text id="api-tag-1-label" x="52" y="151" font-size="11" class="t-mut" text-anchor="start">contacts</text>
  <text id="api-tag-1-count" x="226" y="151" font-size="10" class="t-mut" text-anchor="end">7</text>
  <rect id="api-tag-2" x="38" y="168" width="202" height="28" rx="7" class="sub"/>
  <text id="api-tag-2-label" x="52" y="187" font-size="11" class="t-mut" text-anchor="start">scenarios</text>
  <text id="api-tag-2-count" x="226" y="187" font-size="10" class="t-mut" text-anchor="end">6</text>
  <rect id="api-tag-3" x="38" y="204" width="202" height="28" rx="7" class="sub"/>
  <text id="api-tag-3-label" x="52" y="223" font-size="11" class="t-mut" text-anchor="start">templates</text>
  <text id="api-tag-3-count" x="226" y="223" font-size="10" class="t-mut" text-anchor="end">11</text>
  <rect id="api-main" x="266" y="60" width="530" height="236" rx="10" class="panel"/>
  <rect id="api-ep-0" x="282" y="76" width="498" height="42" rx="8" class="sub"/>
  <rect id="api-ep-0-method" x="296" y="88" width="46" height="18" rx="9" class="" style="fill:#2F9E44"/>
  <text id="api-ep-0-method-text" x="319.0" y="101" font-size="9" class="t b" text-anchor="middle" style="fill:#FFFFFF">GET</text>
  <text id="api-ep-0-path" x="352" y="102" font-size="11" class="t mono" text-anchor="start">/phones/</text>
  <text id="api-ep-0-summary" x="560" y="102" font-size="10" class="t-mut" text-anchor="start">List my phones</text>
  <rect id="api-ep-1" x="282" y="130" width="498" height="42" rx="8" class="sub"/>
  <rect id="api-ep-1-method" x="296" y="142" width="46" height="18" rx="9" class="" style="fill:#E67700"/>
  <text id="api-ep-1-method-text" x="319.0" y="155" font-size="9" class="t b" text-anchor="middle" style="fill:#FFFFFF">POST</text>
  <text id="api-ep-1-path" x="352" y="156" font-size="11" class="t mono" text-anchor="start">/phones/provision</text>
  <text id="api-ep-1-summary" x="560" y="156" font-size="10" class="t-mut" text-anchor="start">Provision phone</text>
  <rect id="api-try" x="282" y="190" width="498" height="90" rx="8" class="sub"/>
  <text id="api-try-title" x="300" y="212" font-size="11" class="t b" text-anchor="start">Try it</text>
  <rect id="api-send" x="690" y="198" width="76" height="26" rx="8" class="" style="fill:#3B5BDB"/>
  <text id="api-send-label" x="728.0" y="215.0" font-size="11" class="t b" text-anchor="middle" style="fill:#FFFFFF">Send</text>
  <rect id="api-response" x="300" y="226" width="462" height="42" rx="6" class="" style="fill:#1E1E1E"/>
  <text id="api-response-body" x="316" y="252" font-size="10" class="mono" text-anchor="start" style="fill:#86EFAC">{ &quot;ok&quot;: true, &quot;items&quot;: [ … ] }</text>
  <g id="callout-1">
    <circle cx="140" cy="34" r="11" class="cal"/>
    <text x="140" y="38" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 151 34 L 148 34"/>
  <g id="callout-2">
    <circle cx="262" cy="110" r="11" class="cal"/>
    <text x="262" y="114" class="cal-t" text-anchor="middle">2</text>
  </g>
  <path class="dash" d="M 251 110 L 244 110"/>
  <g id="callout-3">
    <circle cx="310" cy="310" r="11" class="cal"/>
    <text x="310" y="314" class="cal-t" text-anchor="middle">3</text>
  </g>
  <g id="callout-4">
    <circle cx="808" cy="212" r="11" class="cal"/>
    <text x="808" y="216" class="cal-t" text-anchor="middle">4</text>
  </g>
  <path class="dash" d="M 797 212 L 770 212"/>
  <g id="callout-5">
    <circle cx="808" cy="250" r="11" class="cal"/>
    <text x="808" y="254" class="cal-t" text-anchor="middle">5</text>
  </g>
  <path class="dash" d="M 797 250 L 766 250"/>
</svg>
