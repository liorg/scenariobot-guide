<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-label="The mail tab">
  <title>The mail tab</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="780" height="320" rx="10"/>
  <text id="mail-title" x="28" y="36" font-size="14" class="t b" text-anchor="start">3 senders</text>
  <rect id="mail-search" x="520" y="20" width="234" height="28" rx="8" class="sub"/>
  <text id="mail-search-ph" x="536" y="39" font-size="11" class="t-mut" text-anchor="start">Search sender, subject or text</text>
  <rect id="mail-list" x="24" y="60" width="730" height="236" rx="10" class="panel"/>
  <circle id="mail-0-avatar" cx="66" cy="98" r="18" fill="#3B5BDB" fill-opacity="0.15"/>
  <text id="mail-0-icon" x="66" y="104" font-size="15" class="t b" text-anchor="middle" style="fill:#3B5BDB">@</text>
  <text id="mail-0-sender" x="98" y="90" font-size="11" class="t b mono" text-anchor="start">noreply@bank.co.il</text>
  <rect id="mail-0-count" x="258" y="78" width="30" height="18" rx="9" class="" style="fill:#EEF2FF"/>
  <text id="mail-0-count-text" x="273.0" y="91" font-size="9" class="t b" text-anchor="middle" style="fill:#3B5BDB">4</text>
  <text id="mail-0-subject" x="98" y="110" font-size="11" class="t b" text-anchor="start">Your verification code</text>
  <text id="mail-0-preview" x="98" y="128" font-size="11" class="t-mut" text-anchor="start">Your code is 482913. It expires in…</text>
  <rect id="mail-0-status" x="560" y="78" width="112" height="18" rx="9" class="" style="fill:#EBFBEE"/>
  <text id="mail-0-status-text" x="616.0" y="91" font-size="9" class="t b" text-anchor="middle" style="fill:#2F9E44">Sent to scenario</text>
  <text id="mail-0-time" x="722" y="90" font-size="10" class="t-mut" text-anchor="end">23/11 20:14</text>
  <line x1="40" y1="140" x2="738" y2="140" class="line"/>
  <circle id="mail-1-avatar" cx="66" cy="174" r="18" fill="#3B5BDB" fill-opacity="0.15"/>
  <text id="mail-1-icon" x="66" y="180" font-size="15" class="t b" text-anchor="middle" style="fill:#3B5BDB">@</text>
  <text id="mail-1-sender" x="98" y="166" font-size="11" class="t b mono" text-anchor="start">alerts@shop.com</text>
  <rect id="mail-1-count" x="258" y="154" width="30" height="18" rx="9" class="" style="fill:#EEF2FF"/>
  <text id="mail-1-count-text" x="273.0" y="167" font-size="9" class="t b" text-anchor="middle" style="fill:#3B5BDB">9</text>
  <text id="mail-1-subject" x="98" y="186" font-size="11" class="t b" text-anchor="start">Order confirmed</text>
  <text id="mail-1-preview" x="98" y="204" font-size="11" class="t-mut" text-anchor="start">Thanks for your order #8812</text>
  <rect id="mail-1-status" x="560" y="154" width="112" height="18" rx="9" class="" style="fill:#FFF9DB"/>
  <text id="mail-1-status-text" x="616.0" y="167" font-size="9" class="t b" text-anchor="middle" style="fill:#E67700">Too old, not sent</text>
  <text id="mail-1-time" x="722" y="166" font-size="10" class="t-mut" text-anchor="end">23/11 20:14</text>
  <line x1="40" y1="216" x2="738" y2="216" class="line"/>
  <circle id="mail-2-avatar" cx="66" cy="250" r="18" fill="#3B5BDB" fill-opacity="0.15"/>
  <text id="mail-2-icon" x="66" y="256" font-size="15" class="t b" text-anchor="middle" style="fill:#3B5BDB">@</text>
  <text id="mail-2-sender" x="98" y="242" font-size="11" class="t b" text-anchor="start">Unknown sender</text>
  <rect id="mail-2-count" x="258" y="230" width="30" height="18" rx="9" class="" style="fill:#EEF2FF"/>
  <text id="mail-2-count-text" x="273.0" y="243" font-size="9" class="t b" text-anchor="middle" style="fill:#3B5BDB">1</text>
  <text id="mail-2-preview" x="98" y="262" font-size="11" class="t-mut" text-anchor="start">Welcome aboard!</text>
  <text id="mail-2-time" x="722" y="242" font-size="10" class="t-mut" text-anchor="end">23/11 20:14</text>
  <g id="callout-1">
    <circle cx="136" cy="36" r="11" class="cal"/>
    <text x="136" y="40" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 125 36 L 112 36"/>
  <g id="callout-2">
    <circle cx="506" cy="34" r="11" class="cal"/>
    <text x="506" y="38" class="cal-t" text-anchor="middle">2</text>
  </g>
  <path class="dash" d="M 517 34 L 516 34"/>
  <g id="callout-3">
    <circle cx="20" cy="90" r="11" class="cal"/>
    <text x="20" y="94" class="cal-t" text-anchor="middle">3</text>
  </g>
  <path class="dash" d="M 31 90 L 92 90"/>
  <g id="callout-4">
    <circle cx="300" cy="84" r="11" class="cal"/>
    <text x="300" y="88" class="cal-t" text-anchor="middle">4</text>
  </g>
  <g id="callout-5">
    <circle cx="768" cy="86" r="11" class="cal"/>
    <text x="768" y="90" class="cal-t" text-anchor="middle">5</text>
  </g>
  <path class="dash" d="M 757 86 L 676 86"/>
</svg>
