<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="A finished call">
  <title>A finished call</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="780" height="300" rx="10"/>
  <rect id="ch-back" x="24" y="20" width="72" height="26" rx="8" class="panel"/>
  <text id="ch-back-label" x="60.0" y="37.0" font-size="11" class="t b" text-anchor="middle">Back</text>
  <rect id="ch-outcome" x="110" y="20" width="90" height="18" rx="9" class="" style="fill:#EBFBEE"/>
  <text id="ch-outcome-text" x="155.0" y="33" font-size="10" class="t b" text-anchor="middle" style="fill:#2F9E44">completed</text>
  <text id="ch-when" x="220" y="38" font-size="11" class="t-mut" text-anchor="start">13/11 09:12 · 2m 14s</text>
  <rect id="ch-summary" x="24" y="60" width="730" height="56" rx="10" class="panel"/>
  <text id="ch-stat-0-label" x="48" y="82" font-size="9" class="t-mut b" text-anchor="start">SENT</text>
  <text id="ch-stat-0-value" x="48" y="102" font-size="13" class="t b" text-anchor="start">5</text>
  <text id="ch-stat-1-label" x="230" y="82" font-size="9" class="t-mut b" text-anchor="start">RECEIVED</text>
  <text id="ch-stat-1-value" x="230" y="102" font-size="13" class="t b" text-anchor="start">4</text>
  <text id="ch-stat-2-label" x="412" y="82" font-size="9" class="t-mut b" text-anchor="start">UNMATCHED</text>
  <text id="ch-stat-2-value" x="412" y="102" font-size="13" class="t b" text-anchor="start">1</text>
  <text id="ch-stat-3-label" x="594" y="82" font-size="9" class="t-mut b" text-anchor="start">LAST STEP</text>
  <text id="ch-stat-3-value" x="594" y="102" font-size="13" class="t b" text-anchor="start">step 4</text>
  <rect id="ch-timeline" x="24" y="128" width="730" height="148" rx="10" class="panel"/>
  <circle id="ch-ev-0-dot" cx="50" cy="156" r="5" fill="#3B5BDB"/>
  <line x1="50" y1="161" x2="50" y2="182" class="line"/>
  <text id="ch-ev-0-time" x="66" y="160" font-size="10" class="t-mut mono" text-anchor="start">09:12:01</text>
  <text id="ch-ev-0-text" x="150" y="160" font-size="11" class="t b" text-anchor="start">Hi! Are you interested?</text>
  <circle id="ch-ev-1-dot" cx="50" cy="198" r="5" fill="#2F9E44"/>
  <line x1="50" y1="203" x2="50" y2="224" class="line"/>
  <text id="ch-ev-1-time" x="66" y="202" font-size="10" class="t-mut mono" text-anchor="start">09:12:40</text>
  <text id="ch-ev-1-text" x="150" y="202" font-size="11" class="t b" text-anchor="start">Yes</text>
  <circle id="ch-ev-2-dot" cx="50" cy="240" r="5" fill="#E67700"/>
  <text id="ch-ev-2-time" x="66" y="244" font-size="10" class="t-mut mono" text-anchor="start">09:13:02</text>
  <text id="ch-ev-2-text" x="150" y="244" font-size="11" class="t" text-anchor="start">maybe later  — no branch matched</text>
  <rect id="ch-ev-2-flag" x="600" y="232" width="74" height="18" rx="9" class="" style="fill:#FFF9DB"/>
  <text id="ch-ev-2-flag-text" x="637.0" y="245" font-size="9" class="t b" text-anchor="middle" style="fill:#E67700">unmatched</text>
  <g id="callout-1">
    <circle cx="212" cy="34" r="11" class="cal"/>
    <text x="212" y="38" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 201 34 L 204 34"/>
  <g id="callout-2">
    <circle cx="430" cy="290" r="11" class="cal"/>
    <text x="430" y="294" class="cal-t" text-anchor="middle">2</text>
  </g>
  <g id="callout-3">
    <circle cx="612" cy="290" r="11" class="cal"/>
    <text x="612" y="294" class="cal-t" text-anchor="middle">3</text>
  </g>
  <g id="callout-4">
    <circle cx="768" cy="190" r="11" class="cal"/>
    <text x="768" y="194" class="cal-t" text-anchor="middle">4</text>
  </g>
  <path class="dash" d="M 757 190 L 680 190"/>
</svg>
