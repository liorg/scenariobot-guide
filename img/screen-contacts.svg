<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The contacts tab">
  <title>The contacts tab</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="300" rx="10"/>
  <text id="ct-title" x="28" y="36" font-size="14" class="t b" text-anchor="start">12 Contacts</text>
  <rect id="ct-search" x="420" y="20" width="180" height="28" rx="8" class="sub"/>
  <text id="ct-search-ph" x="436" y="39" font-size="11" class="t-mut" text-anchor="start">Search…</text>
  <rect id="ct-add" x="616" y="20" width="118" height="28" rx="8" class="" style="fill:#3B5BDB"/>
  <text id="ct-add-label" x="675.0" y="38.0" font-size="11" class="t b" text-anchor="middle" style="fill:#FFFFFF">+ Add Contact</text>
  <rect id="ct-list" x="24" y="60" width="712" height="216" rx="10" class="panel"/>
  <rect id="ct-head" x="24" y="60" width="712" height="30" rx="0" class="sub"/>
  <text id="ct-th-name" x="56" y="79.0" font-size="9" class="t-mut b" text-anchor="start">NAME</text>
  <text id="ct-th-number" x="250" y="79.0" font-size="9" class="t-mut b" text-anchor="start">NUMBER</text>
  <text id="ct-th-status" x="420" y="79.0" font-size="9" class="t-mut b" text-anchor="start">STATUS</text>
  <text id="ct-th-lang" x="540" y="79.0" font-size="9" class="t-mut b" text-anchor="start">LANG</text>
  <line x1="24" y1="90" x2="736" y2="90" class="line"/>
  <circle id="ct-0-avatar" cx="40" cy="118" r="14" fill="#3B5BDB" fill-opacity="0.15"/>
  <text id="ct-0-initial" x="40" y="123" font-size="11" class="t b" text-anchor="middle" style="fill:#3B5BDB">A</text>
  <text id="ct-0-name" x="62" y="123" font-size="12" class="t b" text-anchor="start">Avi Cohen</text>
  <text id="ct-0-number" x="250" y="123" font-size="11" class="t mono" text-anchor="start">972541234567</text>
  <rect id="ct-0-status" x="420" y="109" width="62" height="18" rx="9" class="" style="fill:#EBFBEE"/>
  <text id="ct-0-status-text" x="451.0" y="122" font-size="9" class="t b" text-anchor="middle" style="fill:#2F9E44">active</text>
  <text id="ct-0-lang" x="546" y="123" font-size="11" class="t-mut mono" text-anchor="start">he</text>
  <text id="ct-0-edit" x="690" y="123" font-size="11" class="t b" text-anchor="start" style="fill:#3B5BDB">Edit</text>
  <line x1="24" y1="146" x2="736" y2="146" class="line"/>
  <circle id="ct-1-avatar" cx="40" cy="174" r="14" fill="#3B5BDB" fill-opacity="0.15"/>
  <text id="ct-1-initial" x="40" y="179" font-size="11" class="t b" text-anchor="middle" style="fill:#3B5BDB">D</text>
  <text id="ct-1-name" x="62" y="179" font-size="12" class="t b" text-anchor="start">Dana</text>
  <text id="ct-1-number" x="250" y="179" font-size="11" class="t mono" text-anchor="start">972501112222</text>
  <rect id="ct-1-status" x="420" y="165" width="62" height="18" rx="9" class="" style="fill:#FFF9DB"/>
  <text id="ct-1-status-text" x="451.0" y="178" font-size="9" class="t b" text-anchor="middle" style="fill:#F59F00">new</text>
  <text id="ct-1-lang" x="546" y="179" font-size="11" class="t-mut mono" text-anchor="start">en</text>
  <text id="ct-1-edit" x="690" y="179" font-size="11" class="t b" text-anchor="start" style="fill:#3B5BDB">Edit</text>
  <line x1="24" y1="202" x2="736" y2="202" class="line"/>
  <circle id="ct-2-avatar" cx="40" cy="230" r="14" fill="#3B5BDB" fill-opacity="0.15"/>
  <text id="ct-2-initial" x="40" y="235" font-size="11" class="t b" text-anchor="middle" style="fill:#3B5BDB">O</text>
  <text id="ct-2-name" x="62" y="235" font-size="12" class="t b" text-anchor="start">Old lead</text>
  <text id="ct-2-number" x="250" y="235" font-size="11" class="t mono" text-anchor="start">972500000000</text>
  <rect id="ct-2-status" x="420" y="221" width="62" height="18" rx="9" class="" style="fill:#F1F3F5"/>
  <text id="ct-2-status-text" x="451.0" y="234" font-size="9" class="t b" text-anchor="middle" style="fill:#868E96">inactive</text>
  <text id="ct-2-lang" x="546" y="235" font-size="11" class="t-mut mono" text-anchor="start">he</text>
  <text id="ct-2-edit" x="690" y="235" font-size="11" class="t b" text-anchor="start" style="fill:#3B5BDB">Edit</text>
  <g id="callout-1">
    <circle cx="748" cy="34" r="11" class="cal"/>
    <text x="748" y="38" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 737 34 L 738 34"/>
  <g id="callout-2">
    <circle cx="410" cy="34" r="11" class="cal"/>
    <text x="410" y="38" class="cal-t" text-anchor="middle">2</text>
  </g>
  <path class="dash" d="M 399 34 L 416 34"/>
  <g id="callout-3">
    <circle cx="486" cy="118" r="11" class="cal"/>
    <text x="486" y="122" class="cal-t" text-anchor="middle">3</text>
  </g>
  <g id="callout-4">
    <circle cx="586" cy="118" r="11" class="cal"/>
    <text x="586" y="122" class="cal-t" text-anchor="middle">4</text>
  </g>
  <g id="callout-5">
    <circle cx="748" cy="118" r="11" class="cal"/>
    <text x="748" y="122" class="cal-t" text-anchor="middle">5</text>
  </g>
  <path class="dash" d="M 737 118 L 718 118"/>
</svg>
