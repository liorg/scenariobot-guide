  <rect id="phone-progress-bg" x="82" y="140" width="476" height="3" rx="2" fill="#3B5BDB" opacity="0.15"/>
  <rect id="phone-progress" x="82" y="140" width="476" height="3" rx="2" fill="#3B5BDB"/>
  <rect id="btn-disconnect" x="82" y="160" width="232" height="30" rx="8" class="" fill="#FFF5F5" stroke="#FFC9C9"/>
