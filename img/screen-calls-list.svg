<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-label="The conversation list">
  <title>The conversation list</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="446" rx="10"/>
  <text id="cl-count" x="28" y="36" font-size="12" class="t-mut b" text-anchor="start">4 active bots (agents) · 2 unidentified · 1 inactive</text>
  <rect id="cl-refresh" x="652" y="20" width="84" height="26" rx="8" class="panel"/>
  <text id="cl-refresh-label" x="694.0" y="37.0" font-size="11" class="t b" text-anchor="middle">Refresh</text>
  <text id="cl-unsynced-title" x="28" y="66" font-size="11" class="t-mut b" text-anchor="start">Unidentified — waiting to connect · 1</text>
  <rect id="cl-unsynced" x="24" y="74" width="712" height="76" rx="10" class="panel"/>
  <circle id="cl-unsynced-0-avatar" cx="62" cy="112" r="18" fill="#F59F00" fill-opacity="0.15" stroke="#F59F00" stroke-width="2" stroke-dasharray="4 3"/>
  <text id="cl-unsynced-0-initial" x="62" y="118" font-size="15" class="t b" text-anchor="middle" style="fill:#F59F00">D</text>
  <text id="cl-unsynced-0-name" x="92" y="109" font-size="13" class="t b" text-anchor="start">~Dana</text>
  <text id="cl-unsynced-0-last" x="92" y="126" font-size="11" class="t-mut" text-anchor="start">972541234567</text>
  <text id="cl-unsynced-0-time" x="700" y="109" font-size="11" class="t-mut" text-anchor="end">14:05</text>
  <rect id="cl-unsynced-0-connect" x="540" y="98" width="84" height="26" rx="8" class="" style="fill:#3B5BDB"/>
  <text id="cl-unsynced-0-connect-label" x="582.0" y="115.0" font-size="11" class="t b" text-anchor="middle" style="fill:#FFFFFF">Connect</text>
  <text id="cl-active-title" x="28" y="174" font-size="11" class="t-mut b" text-anchor="start">Active · 2</text>
  <rect id="cl-active" x="24" y="182" width="712" height="128" rx="10" class="panel"/>
  <circle id="cl-active-0-avatar" cx="62" cy="220" r="18" fill="#3B5BDB" fill-opacity="0.15" stroke="#3B5BDB" stroke-width="2"/>
  <text id="cl-active-0-initial" x="62" y="226" font-size="15" class="t b" text-anchor="middle" style="fill:#3B5BDB">A</text>
  <text id="cl-active-0-name" x="92" y="217" font-size="13" class="t b" text-anchor="start">Avi Cohen</text>
  <text id="cl-active-0-last" x="92" y="234" font-size="11" class="t-mut" text-anchor="start">Yes please</text>
  <text id="cl-active-0-time" x="700" y="217" font-size="11" class="t-mut" text-anchor="end">14:05</text>
  <circle id="cl-active-1-avatar" cx="62" cy="272" r="18" fill="#3B5BDB" fill-opacity="0.15" stroke="#3B5BDB" stroke-width="2"/>
  <text id="cl-active-1-initial" x="62" y="278" font-size="15" class="t b" text-anchor="middle" style="fill:#3B5BDB">N</text>
  <text id="cl-active-1-name" x="92" y="269" font-size="13" class="t b" text-anchor="start">Noa</text>
  <text id="cl-active-1-last" x="92" y="286" font-size="11" class="t-mut" text-anchor="start">Thanks!</text>
  <text id="cl-active-1-time" x="700" y="269" font-size="11" class="t-mut" text-anchor="end">14:05</text>
  <text id="cl-inactive-title" x="28" y="334" font-size="11" class="t-mut b" text-anchor="start">Inactive · 1</text>
  <rect id="cl-inactive" x="24" y="342" width="712" height="76" rx="10" class="panel"/>
  <circle id="cl-inactive-0-avatar" cx="62" cy="380" r="18" fill="#868E96" fill-opacity="0.15" stroke="#868E96" stroke-width="2" stroke-dasharray="1 3"/>
  <text id="cl-inactive-0-initial" x="62" y="386" font-size="15" class="t b" text-anchor="middle" style="fill:#868E96">O</text>
  <text id="cl-inactive-0-name" x="92" y="377" font-size="13" class="t b" text-anchor="start">Old lead</text>
  <rect id="cl-inactive-0-badge" x="168" y="365" width="60" height="18" rx="9" class="" style="fill:#F1F3F5"/>
  <text id="cl-inactive-0-badge-text" x="198.0" y="378" font-size="9" class="t b" text-anchor="middle" style="fill:#868E96">Inactive</text>
  <text id="cl-inactive-0-last" x="92" y="394" font-size="11" class="t-mut" text-anchor="start">972500000000</text>
  <text id="cl-inactive-0-time" x="700" y="377" font-size="11" class="t-mut" text-anchor="end">14:05</text>
  <rect id="cl-inactive-0-connect" x="540" y="366" width="84" height="26" rx="8" class="" style="fill:#3B5BDB"/>
  <text id="cl-inactive-0-connect-label" x="582.0" y="383.0" font-size="11" class="t b" text-anchor="middle" style="fill:#FFFFFF">Connect</text>
  <g id="callout-1">
    <circle cx="748" cy="100" r="11" class="cal"/>
    <text x="748" y="104" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 737 100 L 739 100"/>
  <g id="callout-2">
    <circle cx="748" cy="196" r="11" class="cal"/>
    <text x="748" y="200" class="cal-t" text-anchor="middle">2</text>
  </g>
  <path class="dash" d="M 737 196 L 739 196"/>
  <g id="callout-3">
    <circle cx="748" cy="344" r="11" class="cal"/>
    <text x="748" y="348" class="cal-t" text-anchor="middle">3</text>
  </g>
  <path class="dash" d="M 737 344 L 739 344"/>
  <g id="callout-4">
    <circle cx="510" cy="96" r="11" class="cal"/>
    <text x="510" y="100" class="cal-t" text-anchor="middle">4</text>
  </g>
  <path class="dash" d="M 521 96 L 536 96"/>
</svg>
