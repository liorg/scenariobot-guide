  <text id="loc-row-2-flag" x="90" y="388" font-size="12" class="t" text-anchor="start">🇩🇪</text>
  <text id="loc-row-2-name" x="112" y="388" font-size="11" class="t b" text-anchor="start">Germany</text>
  <text id="loc-row-2-dial" x="330" y="388" font-size="11" class="t mono" text-anchor="start">+49</text>
