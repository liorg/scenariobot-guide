<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-label="Language and country settings">
  <title>Language and country settings</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="820" height="440" rx="10"/>
  <rect id="loc-dialog" x="24" y="18" width="772" height="404" rx="14" class="panel"/>
  <text id="loc-title" x="48" y="48" font-size="15" class="t b" text-anchor="start">Settings</text>
  <rect id="loc-tabs-0" x="48" y="66" width="81.0" height="30" rx="8" class="sub"/>
  <text id="loc-tabs-0-label" x="88.5" y="85" font-size="10" class="t-mut" text-anchor="middle">👤 Personal</text>
  <rect id="loc-tabs-1" x="135.0" y="66" width="167.4" height="30" rx="8" class="" style="fill:#EEF2FF;stroke:#3B5BDB"/>
  <text id="loc-tabs-1-label" x="218.7" y="85" font-size="10" class="t b" text-anchor="middle" style="fill:#3B5BDB">🌍 Language &amp; countries</text>
  <rect id="loc-tabs-2" x="308.4" y="66" width="81.0" height="30" rx="8" class="sub"/>
  <text id="loc-tabs-2-label" x="348.9" y="85" font-size="10" class="t-mut" text-anchor="middle">🔐 Two-step</text>
  <rect id="loc-tabs-3" x="395.4" y="66" width="81.0" height="30" rx="8" class="sub"/>
  <text id="loc-tabs-3-label" x="435.9" y="85" font-size="10" class="t-mut" text-anchor="middle">⚙ Advanced</text>
  <line x1="24" y1="108" x2="796" y2="108" class="line"/>
  <text id="loc-langs-label" x="48" y="136" font-size="9" class="t-mut b" text-anchor="start">MY LANGUAGES · 3 OF 4</text>
