<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" role="img" aria-label="The scenarios tab">
  <title>The scenarios tab</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="286" rx="10"/>
  <rect id="sc-new" x="616" y="20" width="118" height="28" rx="8" class="" style="fill:#3B5BDB"/>
  <text id="sc-new-label" x="675.0" y="38.0" font-size="11" class="t b" text-anchor="middle" style="fill:#FFFFFF">+ New scenario</text>
  <text id="sc-title" x="28" y="38" font-size="14" class="t b" text-anchor="start">Scenarios</text>
  <rect id="sc-0" x="24" y="60" width="712" height="92" rx="12" class="panel"/>
  <text id="sc-0-name" x="44" y="86" font-size="14" class="t b" text-anchor="start">welcome_flow</text>
  <text id="sc-0-desc" x="44" y="104" font-size="11" class="t-mut" text-anchor="start">greets a new lead</text>
  <rect id="sc-0-contact" x="44" y="116" width="180" height="18" rx="9" class="" style="fill:#EEF2FF"/>
  <text id="sc-0-contact-text" x="134.0" y="129" font-size="10" class="t b" text-anchor="middle" style="fill:#3B5BDB">🤖 bot · 972541234567</text>
  <rect id="sc-0-status" x="430" y="92" width="58" height="18" rx="9" class="" style="fill:#EBFBEE"/>
  <text id="sc-0-status-text" x="459.0" y="105" font-size="9" class="t b" text-anchor="middle" style="fill:#2F9E44">active</text>
  <rect id="sc-0-design" x="500" y="88" width="88" height="26" rx="8" class="panel"/>
  <text id="sc-0-design-label" x="544.0" y="105.0" font-size="11" class="t b" text-anchor="middle">🧩 Design</text>
  <rect id="sc-0-playback" x="596" y="88" width="92" height="26" rx="8" class="panel"/>
  <text id="sc-0-playback-label" x="642.0" y="105.0" font-size="11" class="t b" text-anchor="middle">▶ Playback</text>
  <text id="sc-0-delete" x="712" y="106" font-size="13" class="t-mut" text-anchor="middle">🗑</text>
  <rect id="sc-1" x="24" y="164" width="712" height="92" rx="12" class="panel"/>
  <text id="sc-1-name" x="44" y="190" font-size="14" class="t b" text-anchor="start">survey</text>
  <text id="sc-1-desc" x="44" y="208" font-size="11" class="t-mut" text-anchor="start">three questions</text>
  <rect id="sc-1-contact" x="44" y="220" width="180" height="18" rx="9" class="" style="fill:#EEF2FF"/>
  <text id="sc-1-contact-text" x="134.0" y="233" font-size="10" class="t b" text-anchor="middle" style="fill:#3B5BDB">🤖 bot · 972541234567</text>
  <rect id="sc-1-status" x="430" y="196" width="58" height="18" rx="9" class="" style="fill:#F1F3F5"/>
  <text id="sc-1-status-text" x="459.0" y="209" font-size="9" class="t b" text-anchor="middle" style="fill:#868E96">draft</text>
  <rect id="sc-1-design" x="500" y="192" width="88" height="26" rx="8" class="panel"/>
  <text id="sc-1-design-label" x="544.0" y="209.0" font-size="11" class="t b" text-anchor="middle">🧩 Design</text>
  <rect id="sc-1-playback" x="596" y="192" width="92" height="26" rx="8" class="panel"/>
  <text id="sc-1-playback-label" x="642.0" y="209.0" font-size="11" class="t b" text-anchor="middle">▶ Playback</text>
  <text id="sc-1-delete" x="712" y="210" font-size="13" class="t-mut" text-anchor="middle">🗑</text>
  <g id="callout-1">
    <circle cx="748" cy="34" r="11" class="cal"/>
    <text x="748" y="38" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 737 34 L 738 34"/>
  <g id="callout-2">
    <circle cx="459" cy="268" r="11" class="cal"/>
    <text x="459" y="272" class="cal-t" text-anchor="middle">2</text>
  </g>
  <g id="callout-3">
    <circle cx="544" cy="268" r="11" class="cal"/>
    <text x="544" y="272" class="cal-t" text-anchor="middle">3</text>
  </g>
  <g id="callout-4">
    <circle cx="642" cy="268" r="11" class="cal"/>
    <text x="642" y="272" class="cal-t" text-anchor="middle">4</text>
  </g>
  <g id="callout-5">
    <circle cx="134" cy="268" r="11" class="cal"/>
    <text x="134" y="272" class="cal-t" text-anchor="middle">5</text>
  </g>
</svg>
