<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 340" width="702" height="340" role="img" aria-label="The settings dialog">
  <title>The settings dialog</title>

  <style>
    .bg     { fill: #F7F9FC; }
    .panel  { fill: #FFFFFF; stroke: #E4EAF4; stroke-width: 1.5; }
    .sub    { fill: #F1F5F9; stroke: #E4EAF4; stroke-width: 1; }
    .line   { stroke: #E4EAF4; }
    .t      { font-family: 'Segoe UI', Tahoma, sans-serif; fill: #1A2332; }
    .t-mut  { font-family: 'Segoe UI', Tahoma, sans-serif; fill: #8896A7; }
    .b      { font-weight: 700; }
    .mono   { font-family: Consolas, 'JetBrains Mono', monospace; }
    .cal    { fill: #7048E8; }
    .cal-t  { font-family: 'Segoe UI', Tahoma, sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .dash   { stroke: #7048E8; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #121826; }
      .panel { fill: #171D2B; stroke: #2A3347; }
      .sub   { fill: #1F2633; stroke: #2A3347; }
      .line  { stroke: #2A3347; }
      .t     { fill: #E6EAF2; }
      .t-mut { fill: #7D8899; }
      .cal   { fill: #9775FA; }
      .dash  { stroke: #9775FA; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="702" height="340" rx="10"/>
  <rect id="settings-dialog" x="64" y="20" width="560" height="300" rx="12" class="panel" />
  <text id="settings-title" x="88" y="48" font-size="14" class="t b" text-anchor="start" >Settings</text>
  <path id="settings-close" d="M 592 40 L 602 50 M 602 40 L 592 50" stroke="#8896A7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <line x1="64" y1="62" x2="624" y2="62" class="line"/>
  <rect id="settings-tab-personal" x="88" y="76" width="130" height="30" rx="8" class="" fill="#EEF2FF" stroke="#3B5BDB"/>
  <text id="settings-tab-personal-label" x="153.0" y="95" font-size="10" class="t b" text-anchor="middle" style="fill:#3B5BDB">Personal details</text>
  <rect id="settings-tab-two-step" x="252" y="76" width="150" height="30" rx="8" class="sub" />
  <text id="settings-tab-two-step-label" x="327.0" y="95" font-size="10" class="t-mut" text-anchor="middle" >Two-step verification</text>
  <circle id="settings-tab-two-step-alert" cx="393" cy="83" r="5" fill="#E67700"/>
  <rect id="settings-tab-advanced" x="460" y="76" width="96" height="30" rx="8" class="sub" />
  <text id="settings-tab-advanced-label" x="508.0" y="95" font-size="10" class="t-mut" text-anchor="middle" >Advanced</text>
  <text id="settings-full-label" x="88" y="128" font-size="9" class="t-mut b" text-anchor="start" >FULL NAME</text>
  <rect id="settings-full-input" x="88" y="136" width="360" height="28" rx="7" class="sub" />
  <text id="settings-full-value" x="102" y="155" font-size="11" class="t" text-anchor="start" >Dana Levi</text>
  <text id="settings-email-label" x="88" y="170" font-size="9" class="t-mut b" text-anchor="start" >EMAIL</text>
  <rect id="settings-email-input" x="88" y="178" width="360" height="28" rx="7" class="sub" />
  <text id="settings-email-value" x="102" y="197" font-size="11" class="t-mut" text-anchor="start" >dana@example.com</text>
  <text id="settings-language-label" x="88" y="212" font-size="9" class="t-mut b" text-anchor="start" >LANGUAGE</text>
  <rect id="settings-language-input" x="88" y="220" width="360" height="28" rx="7" class="sub" />
  <text id="settings-language-value" x="102" y="239" font-size="11" class="t" text-anchor="start" >English</text>
  <text id="settings-email-lock" x="436" y="197" font-size="9" class="t-mut" text-anchor="end" >read-only</text>
  <circle id="settings-avatar" cx="532" cy="160" r="34" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="1.5"/>
  <text id="settings-avatar-initials" x="532" y="166" font-size="16" class="t b" text-anchor="middle" style="fill:#3B5BDB">DL</text>
  <text id="settings-avatar-hint" x="532" y="210" font-size="9" class="t-mut" text-anchor="middle" >click to change</text>
  <line x1="64" y1="266" x2="624" y2="266" class="line"/>
  <rect id="settings-save" x="502" y="278" width="100" height="30" rx="8" class="" style="fill:#3B5BDB"/>
  <text id="settings-save-label" x="552" y="297" font-size="11" class="t b" text-anchor="middle" fill="#fff">Save</text>
  <rect id="settings-cancel" x="392" y="278" width="96" height="30" rx="8" class="panel" />
  <text id="settings-cancel-label" x="440" y="297" font-size="11" class="t b" text-anchor="middle" >Cancel</text>
  <g id="callout-1">
    <circle cx="30" cy="44" r="11" class="cal"/>
    <text x="30" y="48" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 41 44 L 66 44"/>
  <g id="callout-2">
    <circle cx="30" cy="91" r="11" class="cal"/>
    <text x="30" y="95" class="cal-t" text-anchor="middle">2</text>
  </g>
  <path class="dash" d="M 41 91 L 84 91"/>
  <g id="callout-3">
    <circle cx="393" cy="48" r="11" class="cal"/>
    <text x="393" y="52" class="cal-t" text-anchor="middle">3</text>
  </g>
  <g id="callout-4">
    <circle cx="30" cy="160" r="11" class="cal"/>
    <text x="30" y="164" class="cal-t" text-anchor="middle">4</text>
  </g>
  <path class="dash" d="M 41 160 L 84 160"/>
  <g id="callout-5">
    <circle cx="672" cy="160" r="11" class="cal"/>
    <text x="672" y="164" class="cal-t" text-anchor="middle">5</text>
  </g>
  <path class="dash" d="M 661 160 L 570 160"/>
  <g id="callout-6">
    <circle cx="672" cy="293" r="11" class="cal"/>
    <text x="672" y="297" class="cal-t" text-anchor="middle">6</text>
  </g>
  <path class="dash" d="M 661 293 L 606 293"/>
</svg>
