<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="Playback">
  <title>Playback</title>

  <style>
    .bg{fill:#F7F9FC}.panel{fill:#FFFFFF;stroke:#E4EAF4;stroke-width:1.5}
    .sub{fill:#F1F5F9;stroke:#E4EAF4;stroke-width:1}.line{stroke:#E4EAF4}
    .t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#1A2332}
    .t-mut{font-family:'Segoe UI',Tahoma,sans-serif;fill:#8896A7}
    .t-dis{font-family:'Segoe UI',Tahoma,sans-serif;fill:#BCC5D3}
    .b{font-weight:700}.mono{font-family:Consolas,'JetBrains Mono',monospace}
    .cal{fill:#7048E8}
    .cal-t{font-family:'Segoe UI',Tahoma,sans-serif;fill:#FFF;font-weight:700;font-size:11px}
    .dash{stroke:#7048E8;stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0F1420}.panel{fill:#171D2B;stroke:#2A3347}.sub{fill:#1F2738;stroke:#2A3347}
      .line{stroke:#2A3347}.t{fill:#E6EAF2}.t-mut{fill:#7D8899}.t-dis{fill:#4F5A6B}
      .cal{fill:#9775FA}.dash{stroke:#9775FA}
    }
  </style>

  <rect class="bg" x="0" y="0" width="700" height="320" rx="10"/>
  <rect id="pb-frame" x="24" y="20" width="440" height="280" rx="10" class="panel"/>
  <path id="pb-header" d="M 24 30 a10 10 0 0 1 10 -10 h 420 a10 10 0 0 1 10 10 v 36 h -440 z" fill="#075E54"/>
  <text id="pb-title" x="44" y="50" font-size="12" class="t b" text-anchor="start" style="fill:#FFFFFF">welcome_flow · playback</text>
  <rect id="pb-body" x="24" y="66" width="440" height="184" rx="0" class="" style="fill:#ECE5DD"/>
  <rect id="pb-msg-0" x="220" y="80" width="224" height="40" rx="8" class="" style="fill:#DCF8C6"/>
  <text id="pb-msg-0-text" x="236" y="104" font-size="10" class="t" text-anchor="start" style="fill:#1A2332">Hi! Are you interested?</text>
  <rect id="pb-msg-0-step" x="150" y="90" width="56" height="18" rx="9" class="" style="fill:#EEF2FF"/>
  <text id="pb-msg-0-step-text" x="178.0" y="103" font-size="8" class="t b" text-anchor="middle" style="fill:#3B5BDB">step 1</text>
  <rect id="pb-msg-1" x="44" y="136" width="180" height="40" rx="8" class="" style="fill:#FFFFFF"/>
  <text id="pb-msg-1-text" x="60" y="160" font-size="10" class="t" text-anchor="start" style="fill:#1A2332">Yes</text>
  <rect id="pb-msg-1-expect" x="238" y="146" width="70" height="18" rx="9" class="" style="fill:#EBFBEE"/>
  <text id="pb-msg-1-expect-text" x="273.0" y="159" font-size="8" class="t b" text-anchor="middle" style="fill:#2F9E44">expected</text>
  <rect id="pb-msg-2" x="220" y="192" width="224" height="40" rx="8" class="" style="fill:#DCF8C6"/>
  <text id="pb-msg-2-text" x="236" y="216" font-size="10" class="t" text-anchor="start" style="fill:#1A2332">Great — when?</text>
  <rect id="pb-msg-2-step" x="150" y="202" width="56" height="18" rx="9" class="" style="fill:#EEF2FF"/>
  <text id="pb-msg-2-step-text" x="178.0" y="215" font-size="8" class="t b" text-anchor="middle" style="fill:#3B5BDB">step 3</text>
  <rect id="pb-controls" x="24" y="250" width="440" height="50" rx="0" class="" style="fill:#F0F2F5"/>
  <rect id="pb-play" x="44" y="262" width="70" height="26" rx="8" class="" style="fill:#3B5BDB"/>
  <text id="pb-play-label" x="79.0" y="279.0" font-size="11" class="t b" text-anchor="middle" style="fill:#FFFFFF">▶ Play</text>
  <rect id="pb-step" x="124" y="262" width="70" height="26" rx="8" class="panel"/>
  <text id="pb-step-label" x="159.0" y="279.0" font-size="11" class="t b" text-anchor="middle">Step</text>
  <rect id="pb-reset" x="204" y="262" width="70" height="26" rx="8" class="panel"/>
  <text id="pb-reset-label" x="239.0" y="279.0" font-size="11" class="t b" text-anchor="middle">Reset</text>
  <text id="pb-speed" x="420" y="281" font-size="11" class="t-mut" text-anchor="end">1×</text>
  <g id="callout-1">
    <circle cx="512" cy="100" r="11" class="cal"/>
    <text x="512" y="104" class="cal-t" text-anchor="middle">1</text>
  </g>
  <path class="dash" d="M 501 100 L 468 100"/>
  <g id="callout-2">
    <circle cx="512" cy="148" r="11" class="cal"/>
    <text x="512" y="152" class="cal-t" text-anchor="middle">2</text>
  </g>
  <path class="dash" d="M 501 148 L 210 148"/>
  <g id="callout-3">
    <circle cx="512" cy="196" r="11" class="cal"/>
    <text x="512" y="200" class="cal-t" text-anchor="middle">3</text>
  </g>
  <path class="dash" d="M 501 196 L 312 196"/>
  <g id="callout-4">
    <circle cx="512" cy="275" r="11" class="cal"/>
    <text x="512" y="279" class="cal-t" text-anchor="middle">4</text>
  </g>
  <path class="dash" d="M 501 275 L 280 275"/>
</svg>
